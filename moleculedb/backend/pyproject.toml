[project]
name = "moleculedb"
version = "0.1.0"
description = "moleculedb backend: data science code and FastAPI services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mmpdb>=3.1.6",
    "networkx>=3.7",
    "rdkit>=2026.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
moleculedb = "moleculedb:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
ml = [
    "modal>=1.6.3",
    "scikit-learn>=1.9.1",
    "torch-geometric>=2.8.1",
    "wandb>=0.31.0",
]
# PyTorch build: exactly one of these. Local default is CPU; Modal GPU images use `gpu`.
cpu = ["torch>=2.15.0"]
gpu = ["torch>=2.15.0"]  # PyPI torch = CUDA 13 build
dev = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev", "ml", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

# CPU-only PyTorch for the `cpu` group (no NVIDIA GPU locally); avoids GBs of CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]
