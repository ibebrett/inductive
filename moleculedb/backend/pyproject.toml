[project]
name = "moleculedb"
version = "0.1.0"
description = "moleculedb backend: data science code and FastAPI services"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "mmpdb>=3.1.6",
    "networkx>=3.7",
    "rdkit>=2026.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
moleculedb = "moleculedb:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
